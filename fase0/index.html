<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Integración de bases de datos · IVC</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/fonts/google-sans.css">
  <!-- Barra y logo como en las apps del SVN: mismos componentes del SDK. -->
  <link rel="stylesheet" href="../svn/vendor/fonts.css">
  <link rel="stylesheet" href="../svn/vendor/foundations.css">
  <link rel="stylesheet" href="../svn/vendor/components.css">
  <link rel="stylesheet" href="../svn/vendor/icons.css">
  <link rel="stylesheet" href="../svn/toolbar.css">
  <link rel="stylesheet" href="fase0.css">
  <script src="../svn/vendor/nwt.js"></script>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; background: var(--bg-soft); font-family: var(--font-sans, system-ui, sans-serif); color: var(--text-primary); }
    #escena { flex: 1; min-height: 0; }
    /* tokens.css fija la raíz en 14px y los tokens son rem: el zoom 16/14 deja el toolbar igual al del SVN. */
    #barra { zoom: 1.142857; }
    </style>
</head>
<body>
  <div id="barra"></div>
  <main id="escena"></main>
  <script src="../svn/marca.js"></script>
  <script src="../svn/toolbar.js"></script>
  <script src="fase0.js"></script>
  <script>
    // Se inserta por JS: con el HTML estático el toolbar del SDK no reubica sus slots.
    document.getElementById('barra').innerHTML =
      SVN_TOOLBAR({ marca: window.NAOWEE.entidades, titulo: 'Integración de bases de datos', subtitulo: 'De las fuentes a la API de validación del SVN', acciones: [{ texto: 'Ir a SVN · Platform', id: 'volver' }] });
    document.getElementById('volver').addEventListener('click', function () { location.href = '../svn/index.html'; });
    // La cinta es fija: se publica su alto para reservar espacio bajo la escena (DC-140).
    var ro = new ResizeObserver(function (e) {
      document.documentElement.style.setProperty('--f0-cinta-alto', Math.ceil(e[0].target.getBoundingClientRect().height) + 'px');
    });
    new MutationObserver(function () {
      var c = document.querySelector('.f0-cinta');
      if (c && c !== ro.__c) { if (ro.__c) ro.unobserve(ro.__c); ro.__c = c; ro.observe(c); }
    }).observe(document.getElementById('escena'), { childList: true, subtree: true });
    window.__f0 = Fase0.montar(document.getElementById('escena'), {
      alTerminar: function () { window.__terminadas = (window.__terminadas || 0) + 1; }
    });
  </script>
</body>
</html>
